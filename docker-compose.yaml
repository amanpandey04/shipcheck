services:
  postgres:
    image: postgres:17-alpine
    container_name: release-checklist-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: release_user
      POSTGRES_PASSWORD: release_password
      POSTGRES_DB: release_checklist

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U release_user -d release_checklist"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend

    container_name: release-checklist-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://release_user:release_password@postgres:5432/release_checklist?schema=public"

    ports:
      - "4000:4000"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
